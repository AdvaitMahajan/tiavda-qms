name: DB Backup (Monthly)

# Monthly logical backup of the Supabase Postgres database (roles + schema + data).
# Stored as a downloadable workflow artifact with 400-day retention (long-term).
#
# REQUIRED REPO SECRET:
#   SUPABASE_DB_URL  — the database connection URI (includes password).
#   Dashboard -> Project Settings -> Database -> Connection string (URI).

on:
  schedule:
    - cron: "30 2 1 * *" # 1st of each month, 02:30 UTC
  workflow_dispatch: {} # allow manual runs

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump database (roles + schema + data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi
          stamp="$(date -u +%Y-%m)"
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f "backup/roles.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL"             -f "backup/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only -f "backup/data.sql"
          echo "stamp=$stamp" >> "$GITHUB_ENV"
          ls -lh backup

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: qms-db-backup-monthly-${{ env.stamp }}
          path: backup/*.sql
          retention-days: 400
