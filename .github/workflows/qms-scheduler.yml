name: QMS Scheduler

# Drives the API's scheduled jobs, which have no scheduler of their own:
#   daily            — follow-up + payment reminders, intake expiry, job reminders,
#                      site-visit-today alerts
#   followup-digest  — the day's follow-ups in one email to the chosen recipients
#   weekly           — weekly summary per org
#
# Times are UTC; India is UTC+5:30. 02:30 UTC = 08:00 IST.
#
# REQUIRED REPO SECRETS:
#   QMS_API_URL   — API base, e.g. https://tiavda-qms-production.up.railway.app/api
#   QMS_CRON_SECRET — must match CRON_SECRET in the API's Railway variables

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST daily
    - cron: "30 5 * * *"   # 11:00 IST daily — follow-up digest
    - cron: "30 3 * * 1"   # 09:00 IST Mondays — weekly summary
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: daily
        type: choice
        options: [daily, followup-digest, weekly]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Decide which job this run covers
        id: pick
        run: |
          set -euo pipefail
          case "${{ github.event.schedule }}" in
            "30 2 * * *") echo "job=daily"           >> "$GITHUB_OUTPUT" ;;
            "30 5 * * *") echo "job=followup-digest" >> "$GITHUB_OUTPUT" ;;
            "30 3 * * 1") echo "job=weekly"          >> "$GITHUB_OUTPUT" ;;
            *)            echo "job=${{ inputs.job || 'daily' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Trigger ${{ steps.pick.outputs.job }}
        env:
          API_URL: ${{ secrets.QMS_API_URL }}
          CRON_SECRET: ${{ secrets.QMS_CRON_SECRET }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::QMS_API_URL and QMS_CRON_SECRET must both be set as repo secrets."
            exit 1
          fi
          # Fail the run on a non-2xx so a broken schedule is visible in Actions
          # rather than silently doing nothing, which is the state this replaces.
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${API_URL%/}/cron/${JOB}" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            --max-time 600)
          echo "HTTP $code"
          cat response.json || true
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Cron job '${JOB}' failed with HTTP $code"
            exit 1
          fi
